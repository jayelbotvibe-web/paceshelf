name: Source privacy check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 tools/audit-public-source.py
      - name: Publication media boundary tests
        run: python3 tools/audit-public-source.test.py
      - name: Metadata protocol tests
        run: node --test tools/library-protocol.test.cjs tools/youtube.test.cjs
      - name: Desktop durability tests
        working-directory: desktop
        run: |
          go test -race ./...
          go vet ./...
