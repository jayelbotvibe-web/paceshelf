name: Suggest an improvement
description: Explain a task PaceShelf could make easier.
title: "Idea: "
body:
  - type: markdown
    attributes:
      value: Please use fictional examples and exclude personal library details. Check the README and roadmap for current support and planned work.
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Explain the problem and how you handle it today.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Proposed improvement
      description: Describe the behavior you would find useful and any alternatives.
    validations:
      required: true
