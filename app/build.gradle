plugins { id 'com.android.application' }

android {
    namespace 'org.paceshelf.player'
    compileSdk 35
    defaultConfig {
        applicationId 'org.paceshelf.player'
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName '0.2.1'
        testInstrumentationRunner 'org.paceshelf.player.SelfTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
